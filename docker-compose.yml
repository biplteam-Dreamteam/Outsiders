version: '3.8'

services:
  llm_engine:
    image: ollama/ollama:latest
    container_name: grand-copilot-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:11434/api/tags || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # Pure C++20 High-Frequency Production Backend (Crow + ONNX + Dynamic Batching 3ms)
  cpp_backend:
    build:
      context: .
      dockerfile: Dockerfile.cpp_backend
    container_name: grand-copilot-cpp-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - LLM_BASE_URL=http://llm_engine:11434/v1
      - LLM_MODEL=qwen2.5:3b-instruct-q4_K_M
      - LLM_TIMEOUT=1.5
    volumes:
      - ./models:/app/models
    depends_on:
      - llm_engine
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  ollama_models:
