<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="100%" height="100%" style="background:#0b0f19; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="gradHeader" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="gradFast" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="gradCopilot" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Title & Banner -->
  <rect x="30" y="25" width="1140" height="60" rx="12" fill="#111827" stroke="#1f2937" filter="url(#shadow)"/>
  <text x="60" y="62" fill="#f8fafc" font-size="22" font-weight="700">Outsiders Support Engine : End-to-End Pipeline Architecture</text>
  <rect x="940" y="42" width="200" height="26" rx="13" fill="#1e293b"/>
  <text x="960" y="59" fill="#38bdf8" font-size="12" font-weight="600">Enterprise High-Load v2.4</text>

  <!-- Step 1: Input -->
  <g transform="translate(50, 115)">
    <rect width="240" height="130" rx="10" fill="#111827" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
    <rect width="240" height="28" rx="10" fill="#1e293b"/>
    <text x="15" y="19" fill="#60a5fa" font-size="12" font-weight="700">1. INGESTION GATEWAY</text>
    <text x="15" y="55" fill="#f1f5f9" font-size="14" font-weight="600">Входящий поток запросов</text>
    <text x="15" y="78" fill="#94a3b8" font-size="12">- JSONL / REST / GZ Stream</text>
    <text x="15" y="98" fill="#94a3b8" font-size="12">- ijson buffer &lt; 400 MB RAM</text>
    <text x="15" y="118" fill="#10b981" font-size="11" font-weight="600">Throughput: 214+ req/s</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M 290 180 L 330 180" stroke="#3b82f6" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <!-- Step 2: Normalization & Decoding -->
  <g transform="translate(340, 115)">
    <rect width="250" height="130" rx="10" fill="#111827" stroke="#6366f1" stroke-width="2" filter="url(#shadow)"/>
    <rect width="250" height="28" rx="10" fill="#1e293b"/>
    <text x="15" y="19" fill="#818cf8" font-size="12" font-weight="700">2. L1 HARDWARE DECODER</text>
    <text x="15" y="55" fill="#f1f5f9" font-size="14" font-weight="600">CP1251 SIMD Repair</text>
    <text x="15" y="78" fill="#94a3b8" font-size="12">- Fix 7 KZ characters in L1 cache</text>
    <text x="15" y="98" fill="#94a3b8" font-size="12">- UZ apostrophe normalization</text>
    <text x="15" y="118" fill="#818cf8" font-size="11" font-weight="600">Lang: RU / KZ / UZ / EN (99.4%)</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path d="M 590 180 L 630 180" stroke="#6366f1" stroke-width="3" fill="none"/>

  <!-- Step 3: Entity Extraction -->
  <g transform="translate(640, 115)">
    <rect width="250" height="130" rx="10" fill="#111827" stroke="#8b5cf6" stroke-width="2" filter="url(#shadow)"/>
    <rect width="250" height="28" rx="10" fill="#1e293b"/>
    <text x="15" y="19" fill="#a78bfa" font-size="12" font-weight="700">3. ENTITY & FACT PARSER</text>
    <text x="15" y="55" fill="#f1f5f9" font-size="14" font-weight="600">Zero-Allocation Extraction</text>
    <text x="15" y="78" fill="#94a3b8" font-size="12">- Nickname pattern matching</text>
    <text x="15" y="98" fill="#94a3b8" font-size="12">- Server 01-30 ID or strict null</text>
    <text x="15" y="118" fill="#a78bfa" font-size="11" font-weight="600">Proof flags: images/links/time</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <path d="M 890 180 L 930 180" stroke="#8b5cf6" stroke-width="3" fill="none"/>

  <!-- Step 4: ML Core -->
  <g transform="translate(940, 115)">
    <rect width="210" height="130" rx="10" fill="#111827" stroke="#ec4899" stroke-width="2" filter="url(#shadow)"/>
    <rect width="210" height="28" rx="10" fill="#1e293b"/>
    <text x="15" y="19" fill="#f472b6" font-size="12" font-weight="700">4. DUAL CATBOOST ML</text>
    <text x="15" y="55" fill="#f1f5f9" font-size="14" font-weight="600">Predictive ML Triage</text>
    <text x="15" y="78" fill="#94a3b8" font-size="12">- TF-IDF char_wb (3,5)</text>
    <text x="15" y="98" fill="#94a3b8" font-size="12">- Category (14) + Priority (4)</text>
    <text x="15" y="118" fill="#f472b6" font-size="11" font-weight="600">Confidence Scoring (Softmax)</text>
  </g>

  <!-- Downward connector from ML to Decision Gateway -->
  <path d="M 1045 245 L 1045 310 L 600 310 L 600 345" stroke="#f472b6" stroke-width="3" fill="none"/>

  <!-- Step 5: Decision & 3-Factor Risk Gate -->
  <g transform="translate(360, 350)">
    <rect width="480" height="150" rx="14" fill="#18122b" stroke="#a855f7" stroke-width="2" filter="url(#shadow)"/>
    <rect width="480" height="32" rx="14" fill="#2e1065"/>
    <text x="20" y="22" fill="#d8b4fe" font-size="14" font-weight="700">5. THREE-FACTOR RISK GATEWAY &amp; ESCALATION MATRIX</text>
    
    <text x="25" y="60" fill="#e2e8f0" font-size="13" font-weight="600">ФАКТОР 1: Evidence Check</text>
    <text x="240" y="60" fill="#94a3b8" font-size="12">has_evidence / images_count > 0 -> 100% Human</text>

    <text x="25" y="88" fill="#e2e8f0" font-size="13" font-weight="600">ФАКТОР 2: Business Policy</text>
    <text x="240" y="88" fill="#94a3b8" font-size="12">Payment / Account / Cheat / Admin -> 100% Human</text>

    <text x="25" y="116" fill="#e2e8f0" font-size="13" font-weight="600">ФАКТОР 3: Confidence Score</text>
    <text x="240" y="116" fill="#94a3b8" font-size="12">confidence &lt; 0.55 -> 100% Human</text>

    <rect x="25" y="128" width="430" height="1" fill="#4c1d95"/>
  </g>

  <!-- Left Path: Zero-Touch Auto-Resolve -->
  <path d="M 360 425 L 200 425 L 200 540" stroke="#10b981" stroke-width="3" fill="none"/>
  <rect x="210" y="465" width="130" height="24" rx="6" fill="#064e3b"/>
  <text x="220" y="481" fill="#34d399" font-size="11" font-weight="700">PASS (LOW RISK)</text>

  <!-- Right Path: Human Escalation Copilot -->
  <path d="M 840 425 L 1000 425 L 1000 540" stroke="#ec4899" stroke-width="3" fill="none"/>
  <rect x="860" y="465" width="130" height="24" rx="6" fill="#831843"/>
  <text x="870" y="481" fill="#f472b6" font-size="11" font-weight="700">FAIL (HIGH RISK)</text>

  <!-- Left Branch Box: Fast-Path Resolution -->
  <g transform="translate(50, 545)">
    <rect width="400" height="225" rx="12" fill="#062e24" stroke="#10b981" stroke-width="2" filter="url(#shadow)"/>
    <rect width="400" height="32" rx="12" fill="#064e3b"/>
    <text x="20" y="22" fill="#a7f3d0" font-size="14" font-weight="700">FAST-PATH : ZERO-TOUCH AUTO-RESOLVE (52%)</text>
    
    <text x="20" y="60" fill="#f8fafc" font-size="13" font-weight="600">RAG Whitelist Validation:</text>
    <text x="20" y="80" fill="#94a3b8" font-size="12">- Verifies rule citations against 101 whitelist</text>
    <text x="20" y="100" fill="#94a3b8" font-size="12">- Discards manipulated/fake rule numbers (0% Hallucination)</text>

    <text x="20" y="130" fill="#f8fafc" font-size="13" font-weight="600">Deterministic Slot Injector:</text>
    <text x="20" y="150" fill="#94a3b8" font-size="12">- Injects {NICK}, {SERVER} into pre-approved templates</text>
    <text x="20" y="170" fill="#94a3b8" font-size="12">- Latency: 3.4 ms P50 | 8.8 ms P95</text>

    <rect x="20" y="185" width="360" height="28" rx="6" fill="#047857"/>
    <text x="35" y="204" fill="#ffffff" font-size="12" font-weight="700">МГНОВЕННЫЙ ОТВЕТ ИГРОКУ (needs_human: false)</text>
  </g>

  <!-- Right Branch Box: Copilot Assist -->
  <g transform="translate(750, 545)">
    <rect width="400" height="225" rx="12" fill="#2d0d2b" stroke="#ec4899" stroke-width="2" filter="url(#shadow)"/>
    <rect width="400" height="32" rx="12" fill="#701a75"/>
    <text x="20" y="22" fill="#fbcfe8" font-size="14" font-weight="700">COPILOT ASSIST : HUMAN-IN-THE-LOOP (48%)</text>
    
    <text x="20" y="60" fill="#f8fafc" font-size="13" font-weight="600">Local LLM Draft Engine (Qwen 2.5 3B Q4):</text>
    <text x="20" y="80" fill="#94a3b8" font-size="12">- Constrained max_tokens=80, temp=0.2 in Docker</text>
    <text x="20" y="100" fill="#94a3b8" font-size="12">- Runs On-Premise ($0.00 cloud token cost)</text>

    <text x="20" y="130" fill="#f8fafc" font-size="13" font-weight="600">Regex Output Sanitizer:</text>
    <text x="20" y="150" fill="#94a3b8" font-size="12">- Strips fabricated numbers, currency, external links</text>
    <text x="20" y="170" fill="#94a3b8" font-size="12">- Enriches ticket with Category + SLA Priority</text>

    <rect x="20" y="185" width="360" height="28" rx="6" fill="#be185d"/>
    <text x="35" y="204" fill="#ffffff" font-size="12" font-weight="700">ОЧЕРЕДЬ ОПЕРАТОРА С ДРАФТОМ (needs_human: true)</text>
  </g>

  <!-- Center Status / Footer Box -->
  <g transform="translate(470, 600)">
    <rect width="260" height="110" rx="10" fill="#111827" stroke="#374151" filter="url(#shadow)"/>
    <text x="20" y="30" fill="#38bdf8" font-size="13" font-weight="700">100% JSON CONTRACT</text>
    <text x="20" y="55" fill="#94a3b8" font-size="11">ticket_id, category, priority</text>
    <text x="20" y="75" fill="#94a3b8" font-size="11">lang, needs_human, cited_rules</text>
    <text x="20" y="95" fill="#10b981" font-size="11" font-weight="600">0 schema errors in 1000 tickets</text>
  </g>
</svg>
